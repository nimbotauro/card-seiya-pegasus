<!DOCTYPE html>
<html lang="pt">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Fantasy 3d</title>
    
  </head>
  <body class="m-0 bg-[#121214] font-sans text-[#e1e1e6] flex flex-col items-center min-h-screen p-4"><body class="m-0 bg-[#121214] font-sans text-[#e1e1e6] flex flex-col items-center min-h-screen p-4">

  <nav class="w-full max-w-[1000px] flex justify-between items-center mb-8 bg-[#202024] p-4 rounded-xl border border-[#323238]">
    <span class="font-bold text-[#00adb5]">StudioFantasy3D</span>
    <div class="bg-[#323238] px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
      🛒 Carrinho: <span id="contador-carrinho" class="text-[#00adb5]">0</span>
    </div>
  </nav>

  <main id="vitrine-produtos" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-[1000px]">
    </main>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    
    const containerVitrine = document.getElementById('vitrine-produtos');
    const contador = document.getElementById('contador-carrinho');
    let quantidadeNoCarrinho = 0;

    // 1. O MENSAGEIRO (Fetch): Vamos buscar dados de usuários reais de um servidor externo
    // Em vez de produtos, vamos listar "Clientes Premium" da loja como teste de API
    fetch('https://jsonplaceholder.typicode.com/posts')
      .then(resposta => resposta.json()) // Quando a resposta chegar, transformamos o texto em JSON
      .then(usuarios => {
        
        // 2. Agora que os dados chegaram do servidor, fazemos o loop
        usuarios.slice(0, 3).forEach(usuario => { // Pegamos apenas os 3 primeiros para o nosso grid
          
          const cardHTML = `
            <article class="bg-[#202024] p-6 rounded-xl border border-[#323238] shadow-2xl flex flex-col justify-between">
              <div>
                <div class="w-full h-40 bg-[#323238] rounded-lg mb-4 flex items-center justify-center text-4xl text-[#00adb5]">
                  👤
                </div>
                <h2 class="text-[#00adb5] text-xl font-bold mb-1">${usuario.title}</h2>
                <p class="text-[#emerald-400] text-xs font-mono mb-4">@${usuario.body}</p>
              
              </div>
              <footer class="mt-auto">
                <button class="botao-conectar w-full hover:bg-[#007a80] bg-[#00adb5] text-white py-2 px-4 rounded-md transition-colors text-sm font-bold">
                  Ver Perfil de Dev
                </button>
              </footer>
            </article>
          `;
          
          containerVitrine.innerHTML += cardHTML;
        });

        // 3. Reativar os cliques nos botões que nasceram da API
        const botoes = document.querySelectorAll('.botao-conectar');
        botoes.forEach(botao => {
          botao.addEventListener('click', () => {
            quantidadeNoCarrinho++;
            contador.innerText = quantidadeNoCarrinho;
            botao.innerText = "Conectado! 🔗";
            botao.classList.replace('bg-[#00adb5]', 'bg-emerald-600');
          });
        });

      })
      .catch(erro => console.error("Erro ao buscar dados da API:", erro));

  });
  </script>
</body>
</html>
